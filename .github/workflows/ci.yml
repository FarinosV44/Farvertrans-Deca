name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farvertrans_deca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/farvertrans_deca?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/farvertrans_deca?schema=public
      NEXT_PUBLIC_FVD_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci.example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon
      SUPABASE_SERVICE_ROLE_KEY: ci-service
      FVD_HASH_SECRET: ci-hash-secret-0123456789abcdef
      FVD_PDF_BUCKET: deca-pdfs
      FVD_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: node scripts/keel-verify.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:compliance
      - name: Standalone server is CommonJS (Hostinger lsnode.js require() compat)
        run: |
          NEXT_STANDALONE=1 npm run build
          test -f .next/standalone/server.js || { echo "no standalone server.js"; exit 1; }
          # Hostinger's LiteSpeed launcher does require(startupFile); an ESM
          # server.js would throw ERR_REQUIRE_ESM. node --check parses it as
          # CommonJS and fails on ESM `import` / `import.meta`.
          node --check .next/standalone/server.js
          if grep -qE '"type"[[:space:]]*:[[:space:]]*"module"' .next/standalone/package.json; then
            echo "FAIL: .next/standalone/package.json has \"type\": \"module\" — breaks Hostinger preload + require()"
            exit 1
          fi
          # boot it exactly as Hostinger does — require() via server.cjs — and hit a route
          PORT=3000 node -e "require('./server.cjs')" &
          SRV=$!
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -fsS -o /dev/null -w 'standalone via server.cjs: GET / -> %{http_code}\n' http://localhost:3000/
          kill $SRV
      - name: Secret scan
        run: |
          if git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY-----|sk_live_[A-Za-z0-9]{20,}|re_[A-Za-z0-9]{24,}' \
             -- ':!*.md' ':!.env.example' ':!.env.prod.example' ':!.githooks/*' ':!.github/*' ':!scripts/keel-verify.mjs'; then
            echo "secret-shaped string found"; exit 1
          fi
