services:
  db:
    image: postgres:15-alpine
    container_name: fvd-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: farvertrans_deca
    ports:
      - "5432:5432"
    volumes:
      - fvd-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fvd-db-data:
